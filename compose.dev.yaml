# Local database for `npm run dev`. The full stack (core + portal + database) is in
# central_mcp/compose.dev.yaml of the main repository.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      TZ: America/Sao_Paulo
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: portal
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - portal-web-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  portal-web-dev-db:
